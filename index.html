<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0d0f20"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="스터디 RPG"><title>스터디 RPG</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Cinzel:wght@600&display=swap" rel="stylesheet"><style>
:root{--bg:#e9e7f2;--fg:#1c1a30;--cd:#f7f5fc;--ac:#4b3fa8;--at:#fff;--mu:#6b6888;--bd:#cdc8e3;--gd:#9a7316;--gl:rgba(75,63,168,.14);--gl2:rgba(154,115,22,.25);--sr:transparent;--tb:rgba(233,231,242,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0f20;--fg:#ece6d3;--cd:#161a34;--ac:#d9a441;--at:#1a1405;--mu:#9b98b8;--bd:#2c3158;--gd:#d9a441;--gl:rgba(108,91,214,.3);--gl2:rgba(217,164,65,.45);--sr:rgba(255,240,200,.55);--tb:rgba(13,15,32,.88)}}

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -8%,var(--gl),transparent 60%),radial-gradient(1px 1px at 14px 22px,var(--sr) 50%,transparent 52%) 0 0/97px 83px,radial-gradient(1px 1px at 60px 50px,var(--sr) 50%,transparent 52%) 0 0/131px 109px,var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.65 "Noto Serif KR","Nanum Myeongjo",Georgia,"Times New Roman",serif;max-width:560px;margin:auto;padding:12px 14px 80px}

.chest.shake{animation:sh .35s infinite}@keyframes sh{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}

.chest.open .gl{animation:gl 1s forwards}@keyframes gl{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1}100%{opacity:.85;transform:translate(-50%,-50%) scale(var(--s))}}

#gx.f2{animation:fx .7s}#gx.f3{animation:fx 1.2s}@keyframes fx{0%{background:#fff}100%{background:rgba(0,0,0,.72)}}
</style></head><body>
<div class="card"><div class="row sp"><div class="row" style="flex-wrap:nowrap"><div class="emb" id="emb"></div><div><b class="ttl" id="ttl"></b><div class="mu" id="fm"></div></div></div><button class="g" id="snd" style="padding:2px 8px" onclick="S.mu=!S.mu;save();render()"></button></div><div class="bar" style="margin-top:12px"><i id="hpb"></i></div><div class="bar rk" style="margin-top:5px"><i id="rkb"></i></div><div id="top" style="margin-top:10px"></div><div class="mu" id="st"></div></div>
<div class="tabs" id="tabs"></div><div id="main"></div><div id="toast"></div>
<script>
const claude={use:async()=>({limits:async()=>({images:true}),json:async(p,o)=>{o=o||{};let k=localStorage.getItem('srpg_gkey');
if(!k){k=prompt('Google AI Studio에서 만든 Gemini API 키를 입력하세요 (이 기기의 브라우저에만 저장돼요)');if(!k)throw new Error('API 키가 필요해요');localStorage.setItem('srpg_gkey',k.trim())}
const parts=[];for(const b of(o.images||[])){const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});parts.push({inlineData:{mimeType:'image/jpeg',data:d}})}
parts.push({text:p+'\n\nJSON 객체만 출력하세요.'});const ns=o.onStep||(()=>{});ns('📤 사진 '+(o.images||[]).length+'장을 변환했어요 (약 '+Math.round(JSON.stringify(parts).length/1024)+'KB)');
const M=localStorage.getItem('srpg_model')||'gemini-3.8-flash';
ns('⏳ Gemini에 요청을 보냈어요. 응답을 기다리는 중…');const ac=new AbortController(),to=setTimeout(()=>ac.abort(),90000);let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+M+':generateContent?key='+encodeURIComponent(k),{signal:ac.signal,method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{responseMimeType:'application/json'}})})}catch(e){clearTimeout(to);throw new Error(e.name=='AbortError'?'Gemini 응답이 90초 넘게 오지 않아 중단했어요':'Gemini에 연결하지 못했어요: '+e.message)}ns('📥 응답을 받았어요. 내용을 해석하는 중…');
const j=await r.json();clearTimeout(to);if(!r.ok){const m=(j.error&&j.error.message)||('HTTP '+r.status);if(/API key/i.test(m))localStorage.removeItem('srpg_gkey');const e=new Error(m);e.code=r.status;throw e}
const c=j.candidates&&j.candidates[0];if(!c||!c.content)throw new Error('AI가 응답하지 않았어요('+((c&&c.finishReason)||'빈 응답')+')');
const t=c.content.parts.map(x=>x.text||'').join('');return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}})};
</script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const SK=['힘','지능','민첩','행운'];
const SHOP=[{id:'potion',n:'회복 포션',p:2000,d:'최대 HP의 50% 회복 (즉시 사용)'},{id:'scroll',n:'마법 두루마리',p:8000,d:'현실 밖의 행동 1회 허용'},{id:'g힘',n:'철검',p:5000,d:'힘 +2 (1회 구매)',s:'힘'},{id:'g지능',n:'현자의 안경',p:5000,d:'지능 +2 (1회)',s:'지능'},{id:'g민첩',n:'질주의 부츠',p:5000,d:'민첩 +2 (1회)',s:'민첩'},{id:'g행운',n:'네잎클로버',p:5000,d:'행운 +2 (1회)',s:'행운'}];
let S=load(),T=null,R=null,P=null,V=null,RT=null,busy=false,tab='study',lastMsg='';
function load(){try{const j=JSON.parse(localStorage.getItem('srpg'));if(j)return j}catch(e){}return{gold:0,tk:0,hp:100,maxhp:100,stats:{힘:5,지능:5,민첩:5,행운:5},inv:{potion:0,scroll:0},owned:{},ev:0,hist:[],cur:null,rec:[]}}
function save(){for(let i=0;i<20;i++){try{localStorage.setItem('srpg',JSON.stringify(S));return}catch(e){const r=S.rec.find(r=>r.f);if(!r)return;r.f=null}}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
async function ai(p,imgs,cb){const s=await claude.use('sample');if(!s)throw new Error('AI를 사용할 수 없어요');return s.json(p,imgs?{images:imgs,onStep:cb,modelTier:'quick',cache:false}:{modelTier:'quick',cache:false})}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function hud(){const i0=ri(),a=RK[i0][1],b=(RK[i0+1]||[0,a+1])[1];$('#emb').textContent=lv();$('#ttl').textContent=title();$('#fm').textContent='명성 '+fame()+(RK[i0+1]?(S.n>=b?' · 🏆 승급 시험 가능 (모험 탭)':' · 다음 등급까지 공부 '+(b-S.n)+'회'):' · 최고 등급');$('#rkb').style.width=(RK[i0+1]?(S.n-a)/(b-a)*100:100)+'%';$('#top').textContent='💰 '+S.gold.toLocaleString()+'  🎟 '+S.tk+'  🕯 '+S.lf+'/4';$('#snd').textContent=S.mu?'🔇':'🔊';$('#hpb').style.width=(S.hp/S.maxhp*100)+'%';$('#hpb').style.background=S.hp<30?'#d9534f':'#4caf7a';$('#st').textContent='HP '+S.hp+'/'+S.maxhp+' · '+SK.map(k=>k+' '+es(k)).join(' · ')+' · 남은 이벤트 '+S.ev+' · 오늘 수련 '+S.dn+'/3'}
function render(){dayCheck();hud();$('#tabs').innerHTML=[['study','공부'],['adv','모험'],['shop','상점'],['rec','기록']].map(a=>`<button class="${tab==a[0]?'':'g'}" onclick="tab='${a[0]}';render()">${a[1]}</button>`).join('');
 const m=$('#main');if(tab=='study')m.innerHTML=studyH();else if(tab=='adv')m.innerHTML=advH();else if(tab=='shop')m.innerHTML=shopH();else m.innerHTML=infoH()+recH();if(S.pq&&tab=='study'&&!T&&!busy)m.innerHTML=quizH()+m.innerHTML;if(S.note)m.innerHTML=noteH()+m.innerHTML;
 if(T){if(tab=='study'){T.v.style.cssText='';$('#prev').appendChild(T.v)}else{T.v.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(T.v)}}if(P&&tab=='rec')pl()}
function studyH(){
 if(busy&&!T)return V?vpH():`<div class="card">${esc(lastMsg||'AI가 공부 영상을 확인하는 중…')}</div>`;
 if(T)return `<div class="card"><div class="big" id="clk">${fmt((T.end-Date.now())/1000)}</div><div class="mu" style="text-align:center">공부 중 · 카메라에 책상과 손이 보이게 두세요</div><div id="prev" style="margin:10px 0"></div><div class="mu" id="ckp" style="margin-bottom:10px">🔍 AI 검사 대기 중 (0%)</div><button class="g" onclick="stopStudy()">포기하기 (보상 없음)</button></div>`;
 if(R)return `<div class="card"><div class="big" id="clk">${fmt((R.end-Date.now())/1000)}</div><div class="mu" style="text-align:center">휴식 중…</div><button class="g" onclick="R=null;render()">휴식 끝내기</button></div>`;
 return `<div class="card"><b>⚒ 40분 수련 (공부)</b><p class="mu">타임랩스로 촬영되고, AI가 공부로 인정하면 1만 골드 · 이벤트 3개 · 뽑기권 1장 · 명성 +10 · 최대 HP +1을 받아요. 공부할수록 명성이 쌓이고 마법사 등급이 올라요. (하루 3번씩 약 1년이면 현자)</p><p class="mu">오늘 수련 ${S.dn}/3 (3번 모두 채우면 보너스 뽑기권 1장 + 10,000골드) · 자정까지 못 채우면 부족한 횟수만큼 공부 목숨이 줄어요 (남은 목숨 ${S.lf}/4). 목숨이 다 닳으면 골드와 아이템을 모두 잃어요.</p>${slotsH()}
 <input type="text" id="subj" placeholder="오늘 공부할 과목 (예: 영어 단어) — 끝나면 복습 퀴즈가 나와요" style="margin-bottom:10px"><div class="mu">이번에 올릴 스탯</div><select id="stat">${SK.map(k=>`<option>${k}</option>`).join('')}</select>
 <label class="mu"><input type="checkbox" id="test"> 테스트 모드 (40초)</label><div style="margin-top:10px" class="row"><button onclick="startStudy()">공부 시작</button><button class="g" onclick="R={end:Date.now()+300000};tickStart();render()">5분 휴식</button></div>${lastMsg?`<p>${esc(lastMsg)}</p>`:''}${RT?'<button onclick="retryJudge()">🔁 판정 다시 시도</button>':''}</div>`}
function tickStart(){clearInterval(tickStart.i);tickStart.i=setInterval(()=>{const e=$('#clk');if(T){if(e)e.textContent=fmt((T.end-Date.now())/1000);chkTick();if(Date.now()>=T.end)finish()}else if(R){if(e)e.textContent=fmt((R.end-Date.now())/1000);if(Date.now()>=R.end){R=null;toast('휴식 끝! 다시 공부하러 가요');render()}}else clearInterval(tickStart.i)},500)}
async function startStudy(){
 const test=$('#test').checked,stat=$('#stat').value,subj=($('#subj').value||'').trim().slice(0,40);let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}}})}catch(e){lastMsg=camMsg(e);render();return}
 try{const s=await claude.use('sample');if(s)await s.limits()}catch(e){}
 const v=document.createElement('video');v.setAttribute('playsinline','');v.setAttribute('autoplay','');v.muted=true;v.playsInline=true;v.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(v);v.srcObject=stream;try{await v.play()}catch(e){}
 const total=test?40:2400,c=document.createElement('canvas'),x=c.getContext('2d'),b=document.createElement('canvas'),bx=b.getContext('2d');c.width=160;c.height=120;b.width=240;b.height=180;
 T={end:Date.now()+total*1000,stream,v,stat,f:[],bigs:[],n:0,st:Date.now(),subj,chk:[],nc:0,bi:0,C:test?3:6};lastMsg='';lock();
 const cap=()=>{try{x.drawImage(v,0,0,160,120);T.f.push(c.toDataURL('image/jpeg',.4));if(T.n%(test?5:30)==0){bx.drawImage(v,0,0,240,180);b.toBlob(bl=>bl&&T.bigs.push(bl),'image/jpeg',.5)}T.n++}catch(e){}};
 cap();T.iv=setInterval(cap,test?1000:10000);tickStart();render()}
function lock(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{if(T)T.wl=l;else l.release()}).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(T&&document.visibilityState=='visible')lock()});
function endCam(){if(!T)return;if(T.wl)T.wl.release().catch(()=>{});clearInterval(T.iv);T.stream.getTracks().forEach(t=>t.stop())}
function stopStudy(){endCam();T=null;lastMsg='공부를 포기했어요. 보상은 없어요.';render()}
async function finish(){const t=T;endCam();T=null;return judge(t)}
function retryJudge(){const t=RT;RT=null;if(t)judge(t)}
async function judge(t){t.err=0;busy=true;lastMsg='';const im=pk(t.bigs,6);V={imgs:im.map(b=>URL.createObjectURL(b)),steps:['📸 공부 영상에서 사진 '+im.length+'장을 골랐어요 (약 '+Math.round(im.reduce((a,b)=>a+b.size,0)/1024)+'KB)'],t0:Date.now()};V.timer=setInterval(()=>{const e=$('#vel');if(e)e.textContent=Math.floor((Date.now()-V.t0)/1000)+'초 경과'},500);render();await new Promise(r=>setTimeout(r,500));
 let ok=false,why='',done=false;
 if(t.chk){while(t.nc<t.C)runChk(t);vstep('🔍 구간별 AI 검사 결과를 모으는 중');const w0=Date.now();while(t.chk.some(e=>e.st=='p')&&Date.now()-w0<90000){await new Promise(r=>setTimeout(r,300));vset(Math.round(t.chk.filter(e=>e.st!='p').length/t.C*100))}
  const ds=t.chk.filter(e=>e.st=='ok'||e.st=='no'),yes=ds.filter(e=>e.st=='ok').length;
  if(ds.length>=Math.ceil(t.C/2)){const pc=Math.round(yes/ds.length*100);ok=pc>=60;why='AI가 '+ds.length+'개 구간 중 '+yes+'개에서 공부 중으로 확인했어요 ('+pc+'%)';done=true;vstep((ok?'✅ 공부로 인정했어요':'❌ 인정하지 않았어요')+' — '+why)}
  else{vset(0);vstep('⚠️ 구간 검사 결과가 부족해서 전체 사진으로 다시 판정해요')}}

function ckUi(t){const e=$('#ckp');if(!e)return;const s=t.chk.filter(x=>x.st!='p').length,ic={p:'⏳',ok:'✅',no:'❌',err:'⚠️'},last=[...t.chk].reverse().find(x=>x.note);e.innerHTML='🔍 AI 검사 '+Math.round(s/t.C*100)+'% ('+s+'/'+t.C+') '+t.chk.map(x=>ic[x.st]).join(' ')+(last?'<div>'+esc(last.note)+'</div>':'')}
function useEv(j){const x=uList()[j];if(!x)return;act('아이템 사용: '+x.n+' — '+x.d,x)}
function miscH(){return S.misc.length?'<div class="card"><b>기타 물건</b>'+S.misc.map(x=>'<div style="margin-top:6px">'+esc(x.n)+' <span class="mu">'+esc(x.d)+'</span></div>').join('')+'</div>':''}
function useIt(i){const it=S.items.splice(i,1)[0];const h=Math.round(it.hp/100*S.maxhp);S.hp=Math.min(S.maxhp,S.hp+h);toast(it.n+' 사용! HP +'+h);save();render()}
function shopH(){return `<div class="card row sp"><span>🎟 뽑기권 ${S.tk}장</span><button ${S.tk?'':'disabled'} onclick="gacha()">뽑기</button></div>`+'<div class="mu" style="margin:8px 2px">🕛 상점 재고는 매일 자정에 초기화돼요 (포션 5개 · 두루마리 2개)</div>'+gachaH()+SHOP.map(it=>`<div class="card row sp"><div><b>${it.n}</b> <span class="mu">${it.inv?'':''}${it.s?(S.owned[it.id]?'· 보유':''):'· 보유 '+S.inv[it.id]+' · 오늘 재고 '+(DL[it.id]-((S.bought||{})[it.id]||0))}</span><div class="mu">${it.d}</div></div><button ${S.gold<it.p||(it.s&&S.owned[it.id])?'disabled':''} onclick="buy('${it.id}')">${it.p.toLocaleString()}</button></div>`).join('')}
function recH(){if(!S.rec.length)return '<div class="card mu">아직 기록이 없어요. 인정받은 공부 영상이 여기에 쌓여요.</div>';
 return (P?`<div class="card"><img class="pl" id="pimg"><input type="range" id="prg" style="width:100%" min="0" value="0" oninput="P.i=+this.value;show()"><div class="row"><button onclick="P.run=!P.run;pl()">⏯</button>${[1,2,4,8].map(s=>`<button class="${P.sp==s?'':'g'}" onclick="P.sp=${s};pl()">x${s}</button>`).join('')}<button class="g" onclick="stopP();render()">닫기</button></div></div>`:'')+S.rec.map((r,i)=>`<div class="card row sp"><div>${esc(r.d)}<div class="mu">${r.f?r.f.length+'프레임':'용량 부족으로 영상 삭제됨'}</div></div><button class="g" ${r.f?'':'disabled'} onclick="openP(${i})">하이퍼랩스</button></div>`).reverse().join('')}
function openP(i){stopP();P={f:S.rec[i].f,i:0,sp:2,run:true};render();window.scrollTo(0,0)}
function stopP(){if(P)clearInterval(P.t);P=null}
function show(){const im=$('#pimg');if(!im||!P)return;im.src=P.f[P.i];const g=$('#prg');g.max=P.f.length-1;g.value=P.i}
function pl(){clearInterval(P.t);show();if(P.run)P.t=setInterval(()=>{P.i=(P.i+1)%P.f.length;show()},1000/(6*P.sp))}
if(S.hp==null)S.hp=100;S.w=S.w||{};S.items=S.items||[];S.misc=S.misc||[];S.n=S.n==null?S.rec.length:S.n;S.rk=S.rk==null?riS():S.rk;render();showQ();setInterval(chk,30000);chk();if(S.cur&&S.cur.res==null&&0)render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
