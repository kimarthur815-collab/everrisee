function shopH(){if(!merL)merL=ML[Math.floor(Math.random()*ML.length)];return merH()+`<div class="card row sp"><span>🎟 뽑기권 ${S.tk}장</span><button ${S.tk?'':'disabled'} onclick="gacha()">뽑기</button></div>`+'<div class="mu" style="margin:8px 2px">🕛 상점 재고는 매일 자정에 초기화돼요 (포션 5개 · 두루마리 2개 · 멈추기권 1개)</div>'+gachaH()+SHOP.map(it=>`<div class="card row sp"><div><b>${it.n}</b> <span class="mu">${it.inv?'':''}${it.s?(S.owned[it.id]?'· 보유':''):'· 보유 '+(S.inv[it.id]||0)+' · 오늘 재고 '+(DL[it.id]-((S.bought||{})[it.id]||0))}</span><div class="mu">${it.d}</div></div><button ${S.gold<it.p||(it.s&&S.owned[it.id])?'disabled':''} onclick="buy('${it.id}')">${it.p.toLocaleString()}</button></div>`).join('')}
function recH(){if(!S.rec.length)return '<div class="card mu">아직 기록이 없어요. 인정받은 공부 영상이 여기에 쌓여요.</div>';
 return (P?`<div class="card"><img class="pl" id="pimg"><input type="range" id="prg" style="width:100%" min="0" value="0" oninput="P.i=+this.value;show()"><div class="row"><button onclick="P.run=!P.run;pl()">⏯</button>${[1,2,4,8].map(s=>`<button class="${P.sp==s?'':'g'}" onclick="P.sp=${s};pl()">x${s}</button>`).join('')}<button class="g" onclick="stopP();render()">닫기</button></div></div>`:'')+S.rec.map((r,i)=>`<div class="card row sp"><div>${esc(r.d)}<div class="mu">${r.f?r.f.length+'프레임':'용량 부족으로 영상 삭제됨'}</div></div><button class="g" ${r.f?'':'disabled'} onclick="openP(${i})">하이퍼랩스</button></div>`).reverse().join('')}
function openP(i){stopP();P={f:S.rec[i].f,i:0,sp:2,run:true};render();window.scrollTo(0,0)}
function stopP(){if(P)clearInterval(P.t);P=null}
function show(){const im=$('#pimg');if(!im||!P)return;im.src=P.f[P.i];const g=$('#prg');g.max=P.f.length-1;g.value=P.i}
function pl(){clearInterval(P.t);show();if(P.run)P.t=setInterval(()=>{P.i=(P.i+1)%P.f.length;show()},1000/(6*P.sp))}
if(S.hp==null)S.hp=100;S.w=S.w||{};S.items=S.items||[];S.misc=S.misc||[];S.n=S.n==null?S.rec.length:S.n;S.rk=S.rk==null?riS():S.rk;S.stats.건강=S.stats.건강||5;S.stats.마나=S.stats.마나||5;S.ss=S.ss||{};S.rl=S.rl||{};S.ex=S.ex||[];S.inv.pause=S.inv.pause||0;fixSubj();render();if(S.prof)applyTheme(S.prof.th||0);if(!S.prof)obStart();else{if(S.prof.pin)lockUI();showQ()}setInterval(chk,30000);chk();if(S.cur&&S.cur.res==null&&0)render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
